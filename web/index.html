<meta name="description" content="Post-MBA sport business roles in London and Europe, filtered to what you're looking for.">

<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="top-in">
    <a class="word" href="#/">Touchline</a>
    <nav class="nav" id="nav" aria-label="Primary"></nav>
    <div class="top-tools">
      <button class="icon-btn" id="cmd-open" type="button" aria-label="Search jobs and companies (⌘K)" title="Search  ⌘K"><span class="i i-search" aria-hidden="true"></span></button>

  </div>
</header>
<div id="banner"></div>
<div class="shell" id="shell">

</div>
<footer class="foot" id="foot"></footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>

<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Search" hidden>
  <div class="palette-box">
    <div class="palette-input"><span class="i i-search" aria-hidden="true"></span>
      <input id="palette-q" type="search" placeholder="Search jobs and companies" autocomplete="off" aria-controls="palette-list">
      <kbd>esc</kbd></div>
    <div class="palette-list" id="palette-list" role="listbox"></div>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
